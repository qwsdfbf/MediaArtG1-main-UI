name: Temporary Blender package fetch

on:
  pull_request:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Blender Python module
        run: |
          curl --fail --location --retry 5 \
            'https://files.pythonhosted.org/packages/53/74/827c0930eec8d1b74b8c67d4066bf922f1e15a3d80f0f50ed4a48a2692b1/bpy-5.2.0-cp313-cp313-manylinux_2_28_x86_64.whl' \
            --output bpy-5.2.0-cp313-cp313-manylinux_2_28_x86_64.whl
          sha256sum bpy-5.2.0-cp313-cp313-manylinux_2_28_x86_64.whl
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: bpy-linux-wheel
          path: bpy-5.2.0-cp313-cp313-manylinux_2_28_x86_64.whl
          compression-level: 0
          retention-days: 1
