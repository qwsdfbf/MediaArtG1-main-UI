name: Gelbooru weak-captive seated candidate fetch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Collect candidates
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import csv, io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageStat

          API='https://gelbooru.com/index.php'
          OUT=Path('gel_candidates'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 VisualReferenceResearch/1.0'})
          states=['bound','chains','shackles','handcuffs','rope','cage','prison','dungeon','restrained','torn_clothes','injury','blood','bandages','bruises','rubble','ruins','collar','wires']
          weak=['crying','tears','sad','scared','cowering','exhausted','slouching','injury','blood','bandages','dirty','bruises']
          poses=['sitting','kneeling','sitting_on_ground','seiza','hugging_own_legs']
          fronts=['looking_at_viewer','straight-on']
          queries=[]
          for st in states:
            for w in weak:
              queries.append(f'1girl solo {st} {w}')
          for st in states:
            for p in poses:
              queries.append(f'1girl solo {st} {p}')
          posts={}
          for qi,q in enumerate(queries):
            for pid in range(0,4):
              try:
                r=s.get(API,params={'page':'dapi','s':'post','q':'index','json':'1','tags':q,'limit':'100','pid':pid},timeout=35)
                if r.status_code!=200: break
                data=r.json()
                arr=data.get('post',data) if isinstance(data,dict) else data
                if not isinstance(arr,list): break
                if not arr: break
                for p in arr:
                  try: posts[int(p.get('id'))]=p
                  except: pass
              except Exception:
                break
              time.sleep(.04)
            if qi%25==0: print(qi,len(posts),flush=True)

          sexual={'nude','naked','nipples','panties','underwear','bikini','lingerie','sex','oral','penis','vaginal','anal','masturbation','spread_legs','cameltoe','bondage','ball_gag','cleavage','ass_focus','breast_focus','pussy','cum','tentacle_sex','sex_toy'}
          ai={'ai-generated','ai_assisted','novelai','stable_diffusion','midjourney','ai_art'}
          reject={'1boy','2girls','3girls','multiple_girls','multiple_views','profile','from_behind'}
          weakset=set(weak)|{'head_down','closed_eyes','wince','defeated','sweat','trembling'}
          capture={'bound','bound_arms','bound_ankles','chains','chain','shackles','handcuffs','rope','cage','prison','dungeon','restrained','collar','wires'}
          damage={'torn_clothes','torn_dress','torn_shirt','torn_skirt','injury','blood','dirty','bandages','bruises','bruise','wound','scar'}
          pose=set(poses)|{'wariza','yokozuwari','on_floor'}
          front=set(fronts)|{'facing_viewer','front_view'}
          rows=[]; saved=0
          for pid,p in sorted(posts.items(), reverse=True):
            tags=set(str(p.get('tags') or '').split())
            if not {'1girl','solo'}<=tags: continue
            if tags&sexual or tags&ai or tags&reject: continue
            if not tags&weakset or not tags&(capture|damage) or not tags&pose or not tags&front: continue
            u=p.get('sample_url') or p.get('file_url')
            if not u: continue
            try:
              rr=s.get(u,timeout=35,headers={'Referer':'https://gelbooru.com/'})
              if rr.status_code!=200 or len(rr.content)<5000: continue
              im=Image.open(io.BytesIO(rr.content)).convert('RGB')
              if min(im.size)<250: continue
              probe=im.copy(); probe.thumbnail((320,320)); g=probe.convert('L'); h=g.histogram(); n=max(1,sum(h)); lum=float(ImageStat.Stat(g).mean[0]); dark_fraction=sum(h[:96])/n
              if lum>175 or dark_fraction<0.08: continue
              if max(im.size)>1200: im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              saved+=1; fn=f'{saved:04d}_id{pid}.jpg'; im.save(OUT/fn,'JPEG',quality=91,optimize=True)
              rows.append({'file':fn,'id':pid,'luminance':round(lum,2),'dark_fraction':round(dark_fraction,4),'source':p.get('source',''),'tags':' '.join(sorted(tags))})
              if saved>=800: break
            except Exception: pass
          with open(OUT/'metadata.csv','w',newline='',encoding='utf-8-sig') as f:
            fields=['file','id','luminance','dark_fraction','source','tags']
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          (OUT/'summary.json').write_text(json.dumps({'posts':len(posts),'saved':saved},indent=2),encoding='utf-8')
          print('FINAL',len(posts),saved,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gelbooru-weak-captive-seated-candidates
          path: gel_candidates
          retention-days: 1
          compression-level: 1
