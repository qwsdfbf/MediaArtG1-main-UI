name: Deep pre-AI visual reference candidate fetch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Collect pre-AI candidates
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import csv, io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageStat

          BASE='https://safebooru.donmai.us'
          OUT=Path('deep_candidates'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'VisualReferenceResearch/1.0'})

          core=['bound','chains','shackles','handcuffs','rope','cage','prison','dungeon','tentacles','restrained','torn_clothes','injury','blood','dirty','bandages','bruises','rubble','ruins','debris','collar','wires']
          anchors=[('sitting',18),('kneeling',14),('straight-on',20),('looking_at_viewer',12)]
          pose_ok={'sitting','kneeling','sitting_on_ground','seiza','wariza','yokozuwari','indian_style'}
          front={'straight-on','front_view','facing_viewer','looking_at_viewer'}
          capture={'bound','bound_arms','bound_ankles','chains','chain','shackles','handcuffs','rope','cage','prison','dungeon','tentacles','restrained','collar','wires','spreader_bar','tied_up','mechanical_arms','mechanical_restraints'}
          damage={'torn_clothes','torn_dress','torn_shirt','torn_skirt','injury','blood','dirty','bandages','bruises','wound','scar','torn_sleeves'}
          weak={'crying','tears','sad','scared','afraid','closed_eyes','half-closed_eyes','head_down','hugging_own_legs','cowering','wince','pain','defeated','exhausted','slouching','trembling','sweat','frown','expressionless'}|damage
          dark={'dark','night','dark_background','black_background','indoors','dungeon','prison','ruins','rubble','debris','greyscale','monochrome','shadow','moonlight','dim_lighting','low-key_lighting','cave'}
          seat={'chair','office_chair','throne','bed','bench','sofa','couch','stool','swivel_chair','wheelchair','sitting_on_chair','sitting_on_bed','sitting_on_bench','sitting_on_sofa','sitting_on_throne','sitting_on_vehicle','sitting_on_desk','sitting_on_table'}
          happy={'smile','grin','happy','laughing','smug','seductive_smile','evil_smile','winking','peace_sign','cheerful'}
          sexual={'nude','naked','nipples','breasts_out','panties','underwear_only','bikini','lingerie','sex','oral','penis','vaginal','anal','masturbation','spread_legs','cameltoe','bondage','ball_gag','cleavage','ass_focus','breast_focus','pussy','cum','tentacle_sex','sex_toy'}
          ai={'ai-generated','ai-assisted','novelai','stable_diffusion','midjourney','nai_diffusion'}

          posts={}; origins={}
          for anchor,max_pages in anchors:
            for cue in core:
              cursor=None
              for pi in range(max_pages):
                params={'tags':f'{anchor} {cue}','limit':200}
                if cursor: params['page']=f'b{cursor}'
                try:
                  r=s.get(f'{BASE}/posts.json',params=params,timeout=40)
                  if r.status_code==429:
                    time.sleep(6); r=s.get(f'{BASE}/posts.json',params=params,timeout=40)
                  if r.status_code!=200:
                    print('query',anchor,cue,pi+1,r.status_code,flush=True); break
                  data=r.json()
                except Exception as e:
                  print('query error',anchor,cue,pi+1,repr(e),flush=True); break
                if not data: break
                for p in data:
                  pid=int(p.get('id') or 0)
                  if not pid: continue
                  created=str(p.get('created_at') or '')[:10]
                  if created and created<'2022-07-01':
                    posts[pid]=p; origins.setdefault(pid,set()).add(f'{anchor}+{cue}')
                new_cursor=min(int(p.get('id') or 10**18) for p in data)
                if cursor==new_cursor: break
                cursor=new_cursor
                oldest=min((str(p.get('created_at') or '')[:10] for p in data if p.get('created_at')),default='')
                if oldest and oldest<'2007-01-01': break
                time.sleep(.22)
              print(anchor,cue,'unique_old',len(posts),flush=True)

          def tags_of(p): return set(str(p.get('tag_string') or '').split())
          def media_url(p):
            variants=(p.get('media_asset') or {}).get('variants') or []
            cand=[]
            for v in variants:
              u=v.get('url'); w=int(v.get('width') or 0)
              if u and 420<=w<=1200: cand.append((abs(w-900),u))
            if cand: return min(cand)[1]
            return p.get('large_file_url') or p.get('file_url') or p.get('preview_file_url')

          shortlist=[]
          for pid,p in posts.items():
            t=tags_of(p)
            if p.get('rating')!='g' or '1girl' not in t or {'2girls','3girls','multiple_girls'}&t: continue
            if not t&pose_ok or t&seat or {'standing','lying','on_back','on_stomach'}&t: continue
            if not t&front or not t&(capture|damage) or not t&weak: continue
            if t&happy or t&sexual or t&ai: continue
            u=media_url(p)
            if not u: continue
            score=18*len(t&{'straight-on','front_view','facing_viewer'})+7*len(t&{'looking_at_viewer'})+10*len(t&capture)+10*len(t&damage)+4*len(t&weak)+3*len(t&dark)+(8 if 'full_body' in t else 0)+min(8,int(p.get('score') or 0)//25)
            shortlist.append((score,pid,p,t,u))
          shortlist.sort(reverse=True,key=lambda x:(x[0],int(x[2].get('score') or 0)))
          print('metadata posts',len(posts),'shortlist',len(shortlist),flush=True)

          rows=[]; saved=0
          for score,pid,p,t,u in shortlist:
            if saved>=1600: break
            try:
              rr=s.get(u,timeout=45,headers={'Referer':BASE+'/'})
              rr.raise_for_status()
              im=Image.open(io.BytesIO(rr.content)).convert('RGB')
              if max(im.size)<300: continue
              probe=im.copy(); probe.thumbnail((320,320)); g=probe.convert('L'); h=g.histogram(); n=max(1,sum(h))
              lum=float(ImageStat.Stat(g).mean[0]); dark_fraction=sum(h[:96])/n; bright_fraction=sum(h[215:])/n
              if not ((lum<=176 and dark_fraction>=.14 and bright_fraction<=.55) or (t&dark and lum<=190 and dark_fraction>=.09)): continue
              if max(im.size)>1200: im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              name=f'{saved+1:04d}_id{pid}.jpg'; im.save(OUT/name,'JPEG',quality=91,optimize=True)
              rows.append({'file':name,'id':pid,'score':score,'luminance':round(lum,2),'dark_fraction':round(dark_fraction,4),'created_at':p.get('created_at',''),'artist':p.get('tag_string_artist',''),'character':p.get('tag_string_character',''),'copyright':p.get('tag_string_copyright',''),'source':p.get('source',''),'post_page':f'{BASE}/posts/{pid}','image_url':u,'query_origins':' '.join(sorted(origins.get(pid,set()))),'tags':p.get('tag_string','')})
              saved+=1
              if saved%50==0: print('saved',saved,flush=True)
            except Exception as e:
              print('image error',pid,repr(e),flush=True)
          with open(OUT/'metadata.csv','w',newline='',encoding='utf-8-sig') as f:
            w=csv.DictWriter(f,fieldnames=rows[0].keys() if rows else ['file']); w.writeheader(); w.writerows(rows)
          (OUT/'summary.json').write_text(json.dumps({'metadata_posts':len(posts),'shortlist':len(shortlist),'saved':saved},indent=2),encoding='utf-8')
          print('FINAL SAVED',saved,flush=True)
          PY
      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: deep-pre-ai-visual-candidates
          path: deep_candidates
          retention-days: 1
          compression-level: 1
