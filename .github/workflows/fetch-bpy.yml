name: Zerochan pre-AI distressed captive candidate fetch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Collect Zerochan candidates
        run: |
          python -m pip install --quiet requests pillow beautifulsoup4
          python - <<'PY'
          import csv, io, re, time, html, json
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageStat

          BASE='https://www.zerochan.net'
          OUT=Path('zerochan_candidates'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 VisualReferenceResearch/1.0'})

          combos=[
            ('Crying','Cage'),('Crying','Chain'),('Crying','Handcuffs'),('Crying','Prison'),
            ('Crying','Blood'),('Crying','Bandages'),('Crying','Injured'),('Crying','Torn Clothes'),
            ('Sad','Cage'),('Sad','Chain'),('Sad','Handcuffs'),('Sad','Prison'),('Sad','Blood'),
            ('Scared','Cage'),('Scared','Chain'),('Scared','Handcuffs'),('Scared','Prison'),
            ('Bandages','Cage'),('Bandages','Chain'),('Bandages','Prison'),('Blood','Cage'),
            ('Blood','Chain'),('Blood','Prison'),('Sitting','Cage'),('Sitting','Chain'),
            ('Sitting','Handcuffs'),('Sitting','Prison'),('Kneeling','Cage'),('Kneeling','Chain'),
            ('Kneeling','Handcuffs'),('Kneeling','Prison'),('Crying','Dark'),('Crying','Ruins'),
            ('Crying','Rubble'),('Sad','Ruins'),('Bandages','Ruins'),('Blood','Ruins'),
            ('Crying','Tentacles'),('Sad','Tentacles'),('Scared','Tentacles')]
          ids=set(); origins={}
          for a,b in combos:
            tag=quote(a+','+b, safe=',')
            for p in range(1,31):
              url=f'{BASE}/{tag}?p={p}'
              try:
                r=s.get(url,timeout=35)
                if r.status_code!=200: break
                found=set(map(int,re.findall(r'href=[\"\']/([0-9]{5,8})(?:[\"\'/#?])',r.text)))
                # keep conservative pre-generative-AI era by Zerochan id
                found={i for i in found if i<3700000}
                if not found: break
                before=len(ids)
                ids.update(found)
                for i in found: origins.setdefault(i,set()).add(a+'+'+b)
                if p>=3 and len(ids)==before: break
                time.sleep(.12)
              except Exception:
                break
            print(a,b,len(ids),flush=True)

          def page_info(i):
            try:
              r=s.get(f'{BASE}/{i}',timeout=35)
              if r.status_code!=200: return None
              soup=BeautifulSoup(r.text,'html.parser')
              # Reject pages explicitly marked as AI if present.
              txt=soup.get_text(' ',strip=True).lower()
              if any(x in txt for x in ['ai generated','ai-generated','stable diffusion','novelai','midjourney']): return None
              og=soup.find('meta',attrs={'property':'og:image'})
              image=og.get('content') if og else None
              if not image:
                m=re.search(r'https://static\.zerochan\.net/[^\"\'<> ]+\.(?:jpg|jpeg|png|webp)',r.text,re.I)
                image=html.unescape(m.group(0)) if m else None
              title=(soup.find('title').get_text(' ',strip=True) if soup.find('title') else '')
              return image,title
            except Exception:
              return None

          rows=[]; saved=0
          for i in sorted(ids, reverse=True):
            if saved>=1200: break
            info=page_info(i)
            if not info: continue
            u,title=info
            try:
              rr=s.get(u,timeout=45,headers={'Referer':BASE+'/'})
              if rr.status_code!=200 or len(rr.content)<5000: continue
              im=Image.open(io.BytesIO(rr.content)).convert('RGB')
              if min(im.size)<250: continue
              probe=im.copy(); probe.thumbnail((320,320)); g=probe.convert('L'); h=g.histogram(); n=max(1,sum(h)); lum=float(ImageStat.Stat(g).mean[0]); dark_fraction=sum(h[:96])/n
              if lum>190 or dark_fraction<0.06: continue
              if max(im.size)>1200: im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              saved+=1; fn=f'{saved:04d}_zc{i}.jpg'; im.save(OUT/fn,'JPEG',quality=91,optimize=True)
              rows.append({'file':fn,'zerochan_id':i,'luminance':round(lum,2),'dark_fraction':round(dark_fraction,4),'page':f'{BASE}/{i}','image_url':u,'title':title,'origins':' '.join(sorted(origins.get(i,set())))})
              if saved%50==0: print('saved',saved,flush=True)
              time.sleep(.08)
            except Exception:
              pass
          with open(OUT/'metadata.csv','w',newline='',encoding='utf-8-sig') as f:
            fields=['file','zerochan_id','luminance','dark_fraction','page','image_url','title','origins']
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          (OUT/'summary.json').write_text(json.dumps({'ids':len(ids),'saved':saved},indent=2),encoding='utf-8')
          print('FINAL',len(ids),saved,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zerochan-preai-distressed-captive-candidates
          path: zerochan_candidates
          retention-days: 1
          compression-level: 1
