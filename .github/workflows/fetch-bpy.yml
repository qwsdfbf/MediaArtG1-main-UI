name: Strict all-date female distressed seated candidate fetch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Collect strict candidates
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import csv, io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageStat

          BASE='https://safebooru.donmai.us'
          OUT=Path('strict_all_date'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'VisualReferenceResearch/1.0'})
          anchors=['sitting','kneeling','sitting_on_ground','seiza','hugging_own_legs','on_floor','looking_at_viewer','straight-on']
          cues=['bound','chains','shackles','handcuffs','rope','cage','prison','dungeon','tentacles','restrained','torn_clothes','injury','blood','dirty','bandages','bruises','rubble','ruins','debris','collar','wires','crying','tears','sad','scared','cowering','exhausted','slouching']
          pose={'sitting','kneeling','sitting_on_ground','seiza','wariza','yokozuwari','on_floor','hugging_own_legs','indian_style'}
          seat={'chair','office_chair','throne','bed','bench','sofa','couch','stool','swivel_chair','wheelchair','sitting_on_chair','sitting_on_bed','sitting_on_bench','sitting_on_sofa','sitting_on_throne','sitting_on_vehicle','sitting_on_desk','sitting_on_table'}
          weak={'crying','tears','sad','scared','head_down','hugging_own_legs','cowering','pain','injury','blood','dirty','bandages','bruises','exhausted','slouching','closed_eyes','wince','defeated','sweat','trembling'}
          capture={'bound','bound_arms','bound_ankles','chains','chain','shackles','handcuffs','rope','cage','prison','dungeon','tentacles','restrained','collar','wires','spreader_bar','tied_up_(nonsexual)','mechanical_arms'}
          damage={'torn_clothes','torn_dress','torn_shirt','torn_skirt','torn_sleeves','injury','blood','dirty','bandages','bruises','bruise','wound','scar'}
          front={'straight-on','front_view','facing_viewer','looking_at_viewer'}
          sexual={'nude','naked','nipples','breasts_out','panties','underwear_only','bikini','lingerie','sex','oral','penis','vaginal','anal','masturbation','spread_legs','cameltoe','bondage','ball_gag','cleavage','ass_focus','breast_focus','pussy','cum','tentacle_sex','sex_toy'}
          ai={'ai-generated','ai-assisted','novelai','stable_diffusion','midjourney','nai_diffusion','ai_art'}
          reject={'2girls','3girls','multiple_girls','1boy','multiple_boys','comic','multiple_views','profile','from_behind'}
          posts={}
          for a in anchors:
            for c in cues:
              cursor=None
              for pi in range(12):
                params={'tags':f'{a} {c}','limit':200}
                if cursor: params['page']=f'b{cursor}'
                try:
                  r=s.get(BASE+'/posts.json',params=params,timeout=40)
                  if r.status_code==429:
                    time.sleep(3); r=s.get(BASE+'/posts.json',params=params,timeout=40)
                  if r.status_code!=200: break
                  data=r.json()
                except Exception: break
                if not data: break
                for p in data:
                  pid=int(p.get('id') or 0)
                  if pid: posts[pid]=p
                nc=min(int(p.get('id') or 10**18) for p in data)
                if cursor==nc: break
                cursor=nc
                time.sleep(.08)
              print(a,c,len(posts),flush=True)

          def media_url(p):
            variants=(p.get('media_asset') or {}).get('variants') or []
            cand=[]
            for v in variants:
              u=v.get('url'); w=int(v.get('width') or 0)
              if u and 500<=w<=1400: cand.append((abs(w-1000),u))
            if cand: return min(cand)[1]
            return p.get('large_file_url') or p.get('file_url') or p.get('preview_file_url')

          ranked=[]
          for pid,p in posts.items():
            t=set(str(p.get('tag_string') or '').split())
            if p.get('rating')!='g' or '1girl' not in t or 'solo' not in t: continue
            if t&reject or t&seat or t&sexual or t&ai: continue
            if not t&pose or not t&weak or not t&(capture|damage) or not t&front: continue
            u=media_url(p)
            if not u: continue
            score=28*len(t&weak)+24*len(t&capture)+22*len(t&damage)+28*len(t&front)+12*len(t&{'rubble','ruins','debris','dungeon','prison','dark_background','black_background','indoors','night'})
            ranked.append((score,pid,p,t,u))
          ranked.sort(reverse=True,key=lambda x:x[0])
          rows=[]; saved=0
          for score,pid,p,t,u in ranked:
            if saved>=1000: break
            try:
              rr=s.get(u,timeout=45,headers={'Referer':BASE+'/'})
              if rr.status_code!=200 or len(rr.content)<4000: continue
              im=Image.open(io.BytesIO(rr.content)).convert('RGB')
              if min(im.size)<250: continue
              probe=im.copy(); probe.thumbnail((320,320)); g=probe.convert('L'); h=g.histogram(); n=max(1,sum(h)); lum=float(ImageStat.Stat(g).mean[0]); dark_fraction=sum(h[:96])/n
              if lum>170 or dark_fraction<0.10: continue
              if max(im.size)>1200: im.thumbnail((1200,1200),Image.Resampling.LANCZOS)
              saved+=1; fn=f'{saved:04d}_id{pid}.jpg'; im.save(OUT/fn,'JPEG',quality=91,optimize=True)
              rows.append({'file':fn,'id':pid,'score':score,'luminance':round(lum,2),'dark_fraction':round(dark_fraction,4),'created_at':p.get('created_at',''),'artist':p.get('tag_string_artist',''),'source':p.get('source',''),'post_page':BASE+'/posts/'+str(pid),'tags':p.get('tag_string','')})
              if saved%50==0: print('saved',saved,flush=True)
            except Exception: pass
          with open(OUT/'metadata.csv','w',newline='',encoding='utf-8-sig') as f:
            fields=['file','id','score','luminance','dark_fraction','created_at','artist','source','post_page','tags']
            w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          (OUT/'summary.json').write_text(json.dumps({'posts':len(posts),'ranked':len(ranked),'saved':saved},indent=2),encoding='utf-8')
          print('FINAL',len(posts),len(ranked),saved,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strict-all-date-female-distressed-seated
          path: strict_all_date
          retention-days: 1
          compression-level: 1
