name: Temporary visual-reference focused fetch

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Collect focused candidates
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import csv, io, json, time
          from pathlib import Path
          import requests
          from PIL import Image, ImageStat

          BASE="https://safebooru.donmai.us"
          OUT=Path("focused_candidates"); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({"User-Agent":"VisualReferenceResearch/1.0 (noncommercial reference collection)"})
          core=["bound","chains","shackles","handcuffs","rope","cage","prison","dungeon","tentacles",
                "restrained","torn_clothes","injury","blood","dirty","bandages","bruises","rubble","ruins",
                "debris","collar","wires"]
          anchors=["sitting","kneeling","straight-on"]
          queries=[(a,c) for c in core for a in anchors]
          pose_ok={"sitting","kneeling","sitting_on_ground","seiza"}
          capture={"bound","chains","shackles","handcuffs","rope","cage","prison","dungeon","tentacles","restrained","collar","wires"}
          damage={"torn_clothes","torn_dress","torn_shirt","torn_skirt","injury","blood","dirty","bandages","bruises"}
          weak={"crying","tears","sad","scared","closed_eyes","head_down","hugging_own_legs","cowering","wince","pain","defeated","exhausted","slouching"}|damage
          dark={"dark","night","dark_background","black_background","indoors","dungeon","prison","ruins","rubble","debris","greyscale","monochrome"}
          front={"straight-on","front_view","facing_viewer","looking_at_viewer"}
          reject={"ai-generated","ai-assisted","novelai","stable_diffusion","nude","naked","nipples","areolae","sex","cum","masturbation","panties","underwear_only","bikini","lingerie","spread_legs","pov_crotch","ass_focus","breast_focus","bondage_outfit","1boy","multiple_girls"}
          seat_reject={"sitting_on_chair","sitting_on_bed","sitting_on_bench","sitting_on_sofa","sitting_on_stool","sitting_on_throne","sitting_on_lap","sitting_on_person","sitting_on_desk","sitting_on_table","sitting_on_vehicle"}

          def media_url(p):
              variants=(p.get("media_asset") or {}).get("variants") or []
              usable=[]
              for v in variants:
                  u=v.get("url"); w=v.get("width") or 0
                  if u and 420<=w<=1200: usable.append((abs(w-900),u))
              if usable: return min(usable)[1]
              return p.get("large_file_url") or p.get("file_url") or p.get("preview_file_url")

          posts={}; qn=0
          for anchor,cue in queries:
              qn+=1; tags=f"{anchor} {cue}"
              try:
                  r=s.get(BASE+"/posts.json",params={"tags":tags,"limit":200},timeout=40)
                  print(qn,tags,r.status_code,flush=True)
                  if r.status_code!=200: time.sleep(.8); continue
                  data=r.json()
              except Exception as e:
                  print("query error",tags,type(e).__name__,flush=True); time.sleep(1); continue
              for p in data:
                  t=set(str(p.get("tag_string","")).split())
                  if "1girl" not in t or "solo" not in t or not(t&pose_ok): continue
                  if t&reject or t&seat_reject or not(t&(capture|damage)): continue
                  if p.get("rating") not in ("g",None,""): continue
                  u=media_url(p)
                  if not u: continue
                  score=int(p.get("score") or 0)+28*len(t&(capture|damage))+20*len(t&weak)+14*len(t&dark)+24*len(t&front)
                  if "full_body" in t: score+=12
                  old=posts.get(p["id"])
                  if old is None or score>old[0]: posts[p["id"]]=(score,p,cue,u)
              time.sleep(.45)

          ranked=sorted(posts.values(),key=lambda x:x[0],reverse=True)
          print("metadata candidates",len(ranked),flush=True)
          rows=[]; saved=0
          for score,p,cue,u in ranked:
              if saved>=600: break
              try:
                  rr=s.get(u,timeout=40,headers={"Referer":BASE+"/"})
                  if rr.status_code!=200 or len(rr.content)<4000: continue
                  im=Image.open(io.BytesIO(rr.content)).convert("RGB")
                  if im.width<250 or im.height<250: continue
                  im.thumbnail((1000,1000),Image.Resampling.LANCZOS)
                  lum=ImageStat.Stat(im.resize((64,64)).convert("L")).mean[0]
                  if lum>198: continue
                  saved+=1; fn=f"{saved:04d}_id{p['id']}.jpg"
                  im.save(OUT/fn,"JPEG",quality=89,optimize=True)
                  tags=str(p.get("tag_string","")); ts=set(tags.split())
                  rows.append({"file":fn,"id":p["id"],"score":score,"luminance":round(lum,1),"created_at":p.get("created_at",""),"page":f"{BASE}/posts/{p['id']}","source":p.get("source",""),"artist":p.get("tag_string_artist",""),"pose":",".join(sorted(ts&pose_ok)),"cue":cue,"tags":tags})
                  if saved%25==0: print("saved",saved,flush=True)
              except Exception as e: print("download error",p.get("id"),type(e).__name__,flush=True)
          fields=["file","id","score","luminance","created_at","page","source","artist","pose","cue","tags"]
          with open(OUT/"metadata.csv","w",encoding="utf-8-sig",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          with open(OUT/"summary.json","w") as f: json.dump({"saved":saved,"metadata_candidates":len(ranked)},f,indent=2)
          print("FINAL SAVED",saved,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: focused-visual-reference-candidates
          path: focused_candidates
          compression-level: 6
          retention-days: 1
