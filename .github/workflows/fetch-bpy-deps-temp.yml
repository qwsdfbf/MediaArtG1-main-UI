name: Temporary Blender dependency fetch

on:
  pull_request:
    branches: [main]

jobs:
  fetch-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download bpy runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps
          python -m pip download --only-binary=:all: --dest deps \
            cattrs cython numpy requests zstandard
          ls -lh deps
      - uses: actions/upload-artifact@v4
        with:
          name: bpy-dependencies
          path: deps
          compression-level: 0
          retention-days: 1
